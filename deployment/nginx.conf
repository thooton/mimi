# Cloudflare must use Full (strict) mode. Install a Cloudflare Origin CA or
# publicly trusted certificate and its key at these paths before enabling this
# configuration:
#
#   /etc/nginx/certs/mimi.crt
#   /etc/nginx/certs/mimi.key

server {
	listen 80;
	listen [::]:80;
	server_name learn.example.com edit.example.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name learn.example.com;

	ssl_certificate /etc/nginx/certs/mimi.crt;
	ssl_certificate_key /etc/nginx/certs/mimi.key;
	ssl_protocols TLSv1.2 TLSv1.3;

	root /home/mimi/mimi_frontend;
	index index.html;

	# The trailing slash strips /api/ before proxying. The Rust service receives
	# the /auth/*, /me/*, and public paths it defines directly.
	location ^~ /api/ {
		proxy_pass http://127.0.0.1:4772/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location ^~ /_astro/ {
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# One generated page serves every profile name; this must be an internal
	# rewrite with a 200, not a redirect.
	location ^~ /u/ {
		try_files $uri $uri/ /u/index.html;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name edit.example.com;

	ssl_certificate /etc/nginx/certs/mimi.crt;
	ssl_certificate_key /etc/nginx/certs/mimi.key;
	ssl_protocols TLSv1.2 TLSv1.3;

	# Glossary segments can approach MediaWiki's configured 4 MiB article
	# limit. Leave room for the request wrapper and schema headroom.
	client_max_body_size 16m;

	location / {
		proxy_pass http://127.0.0.1:4771;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
	}
}
